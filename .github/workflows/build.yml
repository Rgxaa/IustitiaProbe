name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build mod
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The wrapper jar is executed by the build; verify its checksum before running it.
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build mod
        run: ./gradlew build --no-daemon
        timeout-minutes: 30

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: iustitia-probe-jar
          path: build/libs/*.jar # glob — the version in the filename bumps, this must not
          if-no-files-found: error
